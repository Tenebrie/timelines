version: 2

updates:
  # Root
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      root-npm:
        patterns: ['*']

  # Styx
  - package-ecosystem: 'npm'
    directory: '/app/styx-frontend'
    schedule:
      interval: 'weekly'
    groups:
      styx-npm:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/app/styx-frontend'
    schedule:
      interval: 'weekly'
    groups:
      styx-docker:
        patterns: ['*']

  # Rhea
  - package-ecosystem: 'npm'
    directory: '/app/rhea-backend'
    schedule:
      interval: 'weekly'
    groups:
      rhea-npm:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/app/rhea-backend'
    schedule:
      interval: 'weekly'
    groups:
      rhea-docker:
        patterns: ['*']

  # Calliope
  - package-ecosystem: 'npm'
    directory: '/app/calliope-websockets'
    schedule:
      interval: 'weekly'
    groups:
      calliope-npm:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/app/calliope-websockets'
    schedule:
      interval: 'weekly'
    groups:
      calliope-docker:
        patterns: ['*']

  # Orpheus
  - package-ecosystem: 'npm'
    directory: '/app/orpheus-mcp'
    schedule:
      interval: 'weekly'
    groups:
      orpheus-npm:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/app/orpheus-mcp'
    schedule:
      interval: 'weekly'
    groups:
      orpheus-docker:
        patterns: ['*']

  # Thetis
  - package-ecosystem: 'npm'
    directory: '/app/thetis-landing'
    schedule:
      interval: 'weekly'
    groups:
      thetis-npm:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/app/thetis-landing'
    schedule:
      interval: 'weekly'
    groups:
      thetis-docker:
        patterns: ['*']

  # ts-shared
  - package-ecosystem: 'npm'
    directory: '/app/ts-shared'
    schedule:
      interval: 'weekly'
    groups:
      ts-shared-npm:
        patterns: ['*']

  # Gatekeeper
  - package-ecosystem: 'docker'
    directory: '/app/gatekeeper-proxy'
    schedule:
      interval: 'weekly'
    groups:
      gatekeeper-docker:
        patterns: ['*']

  # Chronos
  - package-ecosystem: 'docker'
    directory: '/app/chronos-backups'
    schedule:
      interval: 'weekly'
    groups:
      chronos-docker:
        patterns: ['*']

  # E2E Tests
  - package-ecosystem: 'npm'
    directory: '/test/e2e'
    schedule:
      interval: 'weekly'
    groups:
      e2e-npm:
        patterns: ['*']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
