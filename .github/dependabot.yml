version: 2

updates:
  # Root
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      root-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      root-npm-major:
        patterns: ['*']
        update-types: ['major']

  # Styx
