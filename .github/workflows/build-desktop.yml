name: Build Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Echo (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable git symlinks
        run: git config --global core.symlinks true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so git describe finds the release tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Run through git bash to avoid messing with cmd.exe
      - name: Use bash for npm scripts
        if: runner.os == 'Windows'
        run: npm config set script-shell bash

      - name: Install dependencies
        run: npm install
        env:
          HUSKY: 0

      - name: Build and package
        run: npm run build
        working-directory: app/echo-desktop

      - name: Stamp archives with release version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd app/echo-desktop/dist/package
          for archive in neverkin-desktop-*.zip neverkin-desktop-*.tar.gz; do
            [ -e "$archive" ] || continue
            mv "$archive" "neverkin-desktop-$VERSION-${archive#neverkin-desktop-}"
          done
          ls -la

      # the artifact name doubles as the download's .zip filename — keep it
      # distinct from the archive inside, or extraction collides with itself
      - uses: actions/upload-artifact@v7
        with:
          name: neverkin-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-x64-artifact
          path: |
            app/echo-desktop/dist/package/*.zip
            app/echo-desktop/dist/package/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release with archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes artifacts/* ||
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
